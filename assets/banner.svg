<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Davis Brown, Senior Software Engineer">
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="258" rx="12" fill="#1a1b26" stroke="#292e42" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v27H1z" fill="#16161e"/>
  <circle cx="26" cy="21" r="6" fill="#f7768e"/>
  <circle cx="46" cy="21" r="6" fill="#e0af68"/>
  <circle cx="66" cy="21" r="6" fill="#9ece6a"/>
  <text x="450" y="26" font-size="13" fill="#565f89" text-anchor="middle">davis@tokyo: ~</text>

  <!-- prompt: whoami -->
  <text x="32" y="78" font-size="16"><tspan fill="#9ece6a">❯</tspan> <tspan fill="#7dcfff">whoami</tspan></text>
  <text x="32" y="130" font-size="44" font-weight="700" fill="url(#name)">Davis Brown</text>
  <text x="32" y="162" font-size="17" fill="#a9b1d6">Senior Software Engineer <tspan fill="#565f89">·</tspan> Full-stack <tspan fill="#565f89">·</tspan> Oklahoma City</text>

  <!-- prompt: now -->
  <text x="32" y="206" font-size="16"><tspan fill="#9ece6a">❯</tspan> <tspan fill="#7dcfff">cat</tspan> <tspan fill="#c0caf5">now.txt</tspan></text>
  <text x="32" y="232" font-size="16" fill="#e0af68">building Pull Up: live pickup basketball on a map<tspan class="cursor" fill="#c0caf5"> ▍</tspan></text>
</svg>
